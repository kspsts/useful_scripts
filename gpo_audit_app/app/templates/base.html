<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "GPO Audit" }}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><a href="/">GPO Audit</a></div>
      <nav class="tabs">
        <a href="/" class="tab{% if active_tab == 'runs' %} active{% endif %}">Запуски</a>
        <a href="/upload" class="tab{% if active_tab == 'upload' %} active{% endif %}">Загрузка</a>
        <a href="/help" class="tab{% if active_tab == 'help' %} active{% endif %}">Справка</a>
      </nav>
    </div>
  </header>
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
